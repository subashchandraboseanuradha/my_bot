slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    # IF YOu'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
   # map_file_name: /home/bose/dev_ws/first_map_serial
    #map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true  # Commented out as it can cause issues with mapping mode
   # map_start_at_dock: false


    localize: true


    debug_logging: true  # Enable debug logging to help diagnose issues
    throttle_scans: 4  # increased to reduce queue overflow
    transform_publish_period: 0.02  # Adjusted back for stability
    map_update_interval: 2.0  # increased to reduce update frequency
    resolution: 0.1  # reduced mapping resolution for faster processing
    min_laser_range: 0.2  # Adjusted to match actual Lidar capabilities
    max_laser_range: 12.0
    minimum_time_interval: 0.2  # increased to process scans less frequently
    transform_timeout: 1.0  # increased to allow more time for transforms
    tf_buffer_duration: 15.
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3  # increased to reduce scan processing rate
    minimum_travel_heading: 0.2  # increased to reduce scan processing rate
    scan_buffer_size: 20  # reduced to reduce memory usage
    scan_buffer_maximum_scan_distance: 12.0  # Reduced to match max_laser_range
    link_match_minimum_response_fine: 0.35
    link_scan_maximum_distance: 2.5
    loop_search_maximum_distance: 12.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.55

    # Correlation Parameters
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01  # Increased for better stability
    correlation_search_space_smear_deviation: 0.1  # Increased for better stability

    # Loop Closure Parameters
    loop_search_space_dimension: 9.0
    loop_search_space_resolution: 0.05  # Adjusted for stability
    loop_search_space_smear_deviation: 0.03  # Adjusted for stability

    # Scan Matcher Parameters
    distance_variance_penalty: 0.15  # Reduced to be more lenient on distance variations
    angle_variance_penalty: 0.4  # Reduced to be more lenient on angle variations

    fine_search_angle_offset: 0.00325  # Finer angle search for better precision
    coarse_search_angle_offset: 0.3  # Slightly reduced for better initial alignment
    coarse_angle_resolution: 0.03  # Finer resolution for better angle matching
    minimum_angle_penalty: 0.8  # Slightly reduced for more flexible matching
    minimum_distance_penalty: 0.4  # Slightly reduced for more flexible matching
    use_response_expansion: true
