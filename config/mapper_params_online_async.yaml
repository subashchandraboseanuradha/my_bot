slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss  # Better for outlier handling

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping  # Set to mapping mode
    
    # Map file configuration
    #map_file_name: /home/subash/dev_ws/exp_a_serialmap
    #map_start_pose: [0.0, 0.0, 0.0]
    localization: false
    
    # Core parameters
    debug_logging: false  # Disabled for performance
    throttle_scans: 1  # Process every scan
    transform_publish_period: 0.02  # Reduced to match lidar rate
    map_update_interval: 0.5  # More frequent updates
    resolution: 0.05
    
    # Scan parameters
    min_laser_range: 0.15
    max_laser_range: 12.0
    minimum_time_interval: 0.05  # Reduced for more frequent updates
    transform_timeout: 0.2  # Balanced timeout
    tf_buffer_duration: 60.0  # Much larger buffer for transform history
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    
    # Scan matching parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10  # Reduced for faster processing
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  # More lenient matching
    link_scan_maximum_distance: 1.5  # Reduced for better local matches
    
    # Loop closing parameters
    loop_search_maximum_distance: 3.0  # Reduced for more reliable loop closures
    do_loop_closing: true
    loop_match_minimum_chain_size: 3  # Reduced for quicker loop closing
    loop_match_maximum_variance_coarse: 3.0  # More lenient
    loop_match_minimum_response_coarse: 0.35  # More lenient
    loop_match_minimum_response_fine: 0.45  # More lenient
    
    # Correlation Parameters - tuned for balance
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    # Loop Closure Parameters - tuned for balance
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    
    # Scan Matcher Parameters - balanced values
    distance_variance_penalty: 0.2
    angle_variance_penalty: 0.5
    fine_search_angle_offset: 0.00375
    coarse_search_angle_offset: 0.25
    coarse_angle_resolution: 0.02
    minimum_angle_penalty: 0.75
    minimum_distance_penalty: 0.35
    use_response_expansion: true