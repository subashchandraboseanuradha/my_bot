slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Core parameters
    debug_logging: false
    throttle_scans: 2  # Process every other scan to reduce CPU load
    transform_publish_period: 0.02  # 50Hz to match controller rate
    map_update_interval: 0.2  # Increased to 5Hz for smoother updates
    resolution: 0.05
    min_laser_range: 0.1
    max_laser_range: 12.0
    minimum_time_interval: 0.02  # Match controller rate
    transform_timeout: 0.5  # Increased for better reliability
    tf_buffer_duration: 10.0  # Reduced to prevent memory buildup

    # Scan matching parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05  # Reduced for more frequent updates
    minimum_travel_heading: 0.05  # Reduced for more frequent updates
    scan_buffer_size: 15  # Increased for better matching
    scan_buffer_maximum_scan_distance: 5.0  # Reduced for faster processing
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Loop closing parameters
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.2
    angle_variance_penalty: 0.5
    fine_search_angle_offset: 0.00375
    coarse_search_angle_offset: 0.25
    coarse_angle_resolution: 0.02
    minimum_angle_penalty: 0.75
    minimum_distance_penalty: 0.35
    use_response_expansion: true