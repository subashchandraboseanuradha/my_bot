joy_node:
  ros__parameters:
    device_id: 0
    device_name: "Xbox 360 Controller"
    deadzone: 0.05  # Reduced deadzone for faster response
    autorepeat_rate: 50.0  # Increased from 20.0 for more frequent updates
    default_trig_val: true
    publish_rate: 100.0  # Added higher publish rate
    coalesce_interval_ms: 10  # Added to reduce input lag
    wait_for_data: false  # Don't wait for initial data

teleop_node:
  ros__parameters:
    # Xbox 360 controller mapping
    axis_linear:
      x: 1  # Changed to left stick Y-axis
    scale_linear:
      x: 0.3
    scale_linear_turbo:
      x: 0.5

    axis_angular:
      yaw: 0  # Changed to left stick X-axis
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 1.5

    enable_button: 4
    enable_turbo_button: 5
    require_enable_button: false
    
    stamped: false
    frame_id: "base_link"
    
    # Added timing parameters
    cmd_vel_publish_rate: 50.0  # Increased publish rate
    timeout_ticks: 2  # Reduced timeout for faster response