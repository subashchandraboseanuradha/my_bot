joy_node:
  ros__parameters:
    device_id: 0
    device_name: "Xbox 360 Controller"
    deadzone: 0.1  # Increased for D-pad
    autorepeat_rate: 50.0
    default_trig_val: true
    publish_rate: 100.0
    coalesce_interval_ms: 10
    wait_for_data: false

teleop_node:
  ros__parameters:
    # Xbox 360 controller mapping
    # Axes: 6=DPadX, 7=DPadY
    axis_linear:
      x: 7  # D-pad up/down
    scale_linear:
      x: 0.15  # Reduced for D-pad control
    scale_linear_turbo:
      x: 0.3

    axis_angular:
      yaw: 6  # D-pad left/right
    scale_angular:
      yaw: 0.4  # Reduced for D-pad control
    scale_angular_turbo:
      yaw: 0.6

    enable_button: 4  # LB button
    enable_turbo_button: 5  # RB button
    require_enable_button: true  # Enable for safety with D-pad

    stamped: false
    frame_id: "base_link"
    
    # Timing parameters
    cmd_vel_publish_rate: 50.0
    timeout_ticks: 2