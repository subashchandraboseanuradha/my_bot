slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Map file configuration
    map_file_name: ./map
    map_start_pose: [0.0, 0.0, 0.0]

    # Core parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 2.0
    resolution: 0.05

    # Scan parameters - adjusted for your lidar
    min_laser_range: 0.1  # Fixed to match your lidar capabilities
    max_laser_range: 12.0  # Fixed to match your lidar capabilities
    minimum_time_interval: 0.5
    transform_timeout: 0.5
    tf_buffer_duration: 15.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Scan matching parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.05
    scan_buffer_size: 40
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.4
    link_scan_maximum_distance: 4.0

    # Loop closing parameters
    loop_search_maximum_distance: 8.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 0.9
    loop_match_minimum_response_coarse: 0.65
    loop_match_minimum_response_fine: 0.65

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.2
    angle_variance_penalty: 0.4
    fine_search_angle_offset: 0.002
    coarse_search_angle_offset: 0.2
    coarse_angle_resolution: 0.01
    minimum_angle_penalty: 0.8
    minimum_distance_penalty: 0.4
    use_response_expansion: true