amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2  # Increased for odometry noise modeling
    alpha2: 0.2  # Increased for odometry noise modeling
    alpha3: 0.2  # Increased for odometry noise modeling
    alpha4: 0.2  # Increased for odometry noise modeling
    alpha5: 0.1  # Reduced for more stable odometry noise model
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true  # Enabled to handle dynamic environments better
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0  # Reduced for better precision in narrow spaces
    laser_max_range: 12.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60  # Increased for better accuracy
    max_particles: 3000  # Increased for better localization
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.05
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5  # Reduced for more responsive transforms
    update_min_d: 0.05  # Reduced for more frequent updates
    update_min_a: 0.05  # Reduced for more frequent updates
    z_hit: 0.7  # Increased for better matching
    z_max: 0.05
    z_rand: 0.25  # Reduced to give more weight to hits
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
      cov_xx: 0.05  # Initial pose covariance in x
      cov_yy: 0.05  # Initial pose covariance in y
      cov_yaw: 0.05 # Initial pose covariance in yaw

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    transform_tolerance: 0.5  # Reduced for more responsive behavior
    # [Other parameters remain the same]

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]  # We'll keep the name but change the plugin
    transform_tolerance: 0.5  # Reduced for more responsive transforms

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05  # Reduced for better performance in tight spaces
      movement_time_allowance: 10.0
    
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15  # Tighter tolerance for better positioning
      yaw_goal_tolerance: 0.15  # Tighter tolerance for better positioning
      stateful: True
    
    # Changed from DWB to Regulated Pure Pursuit Controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 1.0
      transform_tolerance: 0.1
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # Increased for more responsive obstacle detection
      publish_frequency: 10.0  # Increased for more responsive obstacle detection
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.15
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # Reduced for smoother gradient
        inflation_radius: 0.3  # Increased for safer navigation
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 8
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0  # Increased for better clearing
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0  # Increased for earlier obstacle detection
          obstacle_min_range: 0.1
      always_send_full_costmap: True
      transform_tolerance: 0.5  # Reduced for more responsive transforms

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0  # Increased for more responsive map updates
      publish_frequency: 2.0  # Increased for more responsive visualization
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0  # Increased for better clearing
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0  # Increased for earlier obstacle detection
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # Reduced for smoother gradient
        inflation_radius: 0.3  # Increased for safer navigation
      transform_tolerance: 0.5  # Reduced for more responsive transforms

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.15  # Reduced for more accurate planning
      use_astar: true
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0  # Increased for smoother motion
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.5]  # Slightly increased for better performance
    min_velocity: [-0.2, 0.0, -0.5]  # Added reverse capability
    max_accel: [0.3, 0.0, 0.8]  # Reduced for smoother acceleration
    max_decel: [-0.3, 0.0, -0.8]  # Reduced for smoother deceleration
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 2.0